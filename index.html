    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      @keyframes spinSlow {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(0.95); }
        50% { opacity: 0.8; transform: scale(1.1); }
      }
      .jk-init-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #06060f;
        font-family: 'Space Grotesk', 'Inter', sans-serif;
        color: #f8fafc;
        user-select: none;
      }
      .jk-aura {
        position: absolute;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(124,58,237,0.7), rgba(219,39,119,0.4));
        filter: blur(24px);
        animation: pulseGlow 2s infinite ease-in-out;
        pointer-events: none;
      }
      .jk-ring-wrapper {
        position: relative;
        width: 80px;
        height: 80px;
      }
      .jk-ring {
        position: absolute;
        inset: 0;
        border-radius: 16px;
        padding: 2px;
        background: conic-gradient(from 0deg, #7c3aed, #db2777, #06b6d4, #7c3aed);
        animation: spinSlow 3s linear infinite;
      }
      .jk-box {
        position: absolute;
        inset: 2px;
        background-color: #0a0a16;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      }
      .jk-logo-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 1px;
        background: linear-gradient(135deg, #ffffff 0%, #a78bfa 60%, #f472b6 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .jk-label {
        margin-top: 24px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: rgba(248,250,252,0.9);
      }
      .jk-sub-label {
        margin-top: 6px;
        font-size: 11px;
        font-family: 'JetBrains Mono', monospace;
        color: rgba(167,139,250,0.85);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .jk-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #a78bfa;
        animation: pulseGlow 1s infinite;
      }
    </style>
  </head>
  <body class="bg-[#06060f] text-slate-100 antialiased selection:bg-violet-500/30 selection:text-violet-200">
    <div id="root">
      <!-- Instant HTML/CSS Branded JK Loader -->
      <div class="jk-init-loader">
        <div class="jk-aura"></div>
        <div class="jk-ring-wrapper">
          <div class="jk-ring"></div>
          <div class="jk-box">
            <span class="jk-logo-text">JK</span>
          </div>
        </div>
        <div class="jk-label">Jeevan Kadam</div>
        <div class="jk-sub-label">
          <span class="jk-dot"></span>
          <span>Loading Portfolio...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
